name: Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install numpy pandas scikit-learn joblib pytest
      - name: Run unit tests
        run: pytest -q
      - name: Validate Python syntax
        run: python -m compileall -q data_producer data_processor model_build tests
