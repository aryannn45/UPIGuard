apiVersion: 1

datasources:
  - name: UPIGuard TimescaleDB
    uid: upiguard-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      postgresVersion: 1400
      timescaledb: true
      sslmode: disable
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
    editable: true
